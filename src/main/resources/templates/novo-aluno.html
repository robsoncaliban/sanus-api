<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8" />
		<title>Cadastro de Usuário</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	</head>
	<body>
		<th:block th:replace="~{fragments/menu :: header}"></th:block>
		<h2>Lista de alunos</h2>
		<form th:action="@{/alunos}" th:object="${aluno}" method="post">
			<div>
				<label for="nome">Nome</label>
				<input type="text" id="nome" th:field="*{usuario.nome}" placeholder="Escreva seu nome" required />
			</div>

			<div>
				<label for="email">Email</label>
				<input type="email" id="email" th:field="*{usuario.email}" placeholder="Escreva seu email" required />
			</div>

			<div>
				<label for="senha">Senha</label>
				<input
					type="password"
					id="senha"
					th:field="*{usuario.senha}"
					placeholder="Escreva sua senha"
					required />
			</div>

			<div>
				<label for="telefone">Telefone</label>
				<input
					type="text"
					id="telefone"
					th:field="*{usuario.telefone}"
					placeholder="Escreva seu telefone"
					required />
			</div>

			<div>
				<label for="cpf">CPF</label>
				<input type="text" id="cpf" th:field="*{usuario.cpf}" placeholder="Escreva seu CPF" required />
			</div>

			<div>
				<label for="admin">Administrador</label>
				<input type="checkbox" id="admin" th:field="*{usuario.admin}" />
			</div>

			<button type="submit">Salvar</button>
		</form>
	</body>
</html>
